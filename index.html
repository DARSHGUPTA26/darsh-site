<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">A small test page</p>
      <h1>Hello</h1>
      <p class="lead">
        This page is plain HTML, CSS, and JavaScript. Press the button and the
        page answers.
      </p>
      <button id="greet" type="button">Say hello</button>
      <p id="message" class="message" aria-live="polite">Waiting for a click.</p>
      <p id="count" class="count">Clicks: 0</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
